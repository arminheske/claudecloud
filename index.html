<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Word Race – Demo</title>
</head>
<body style="margin:0;padding:16px;background:#f4f4f8">
  <h1 style="text-align:center;font-family:system-ui,sans-serif">🏎️ Word Race</h1>
  <p style="text-align:center;font-family:system-ui,sans-serif">
    Spieler 1: Tasten <b>1 2 3</b> &nbsp;|&nbsp; Spieler 2: Tasten <b>8 9 0</b>
  </p>
  <div id="game"></div>

  <script src="wordrace.js"></script>
  <script>
    // Beispiel-Vokabeln – in der Plattform durch den echten Wortschatz ersetzen.
    var vocab = [
      { id: 1,  word: 'cat',        translation: 'Katze' },
      { id: 2,  word: 'dog',        translation: 'Hund' },
      { id: 3,  word: 'house',      translation: 'Haus' },
      { id: 4,  word: 'water',      translation: 'Wasser' },
      { id: 5,  word: 'to borrow',  translation: 'ausleihen' },
      { id: 6,  word: 'journey',    translation: 'Reise' },
      { id: 7,  word: 'tired',      translation: 'müde' },
      { id: 8,  word: 'to achieve', translation: 'erreichen' },
      { id: 9,  word: 'reluctant',  translation: 'widerwillig' },
      { id: 10, word: 'ubiquitous', translation: 'allgegenwärtig' },
      { id: 11, word: 'to endeavour', translation: 'bestreben' },
      { id: 12, word: 'scarcity',   translation: 'Knappheit' },
    ];
    WordRace.create(document.getElementById('game'), {
      vocab: vocab,
      onAnswer: function (r) { console.log('answer', r); },
      // r.history in der Plattform speichern und beim nächsten Start als `history` übergeben
      onFinish: function (r) { console.log('finish', r); },
    });
  </script>
</body>
</html>
